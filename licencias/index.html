<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licencias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        tr input, tr select { background-color: #ffffff !important; }
        .mono { font-family: Consolas, monospace; text-transform: uppercase; letter-spacing: 1px; }
        /* Elementos por rol: se muestran según la clase que ponga el script en <body> */
        body:not(.rol-editor):not(.rol-admin) .solo-editor { display: none; }
        body:not(.rol-admin) .solo-admin { display: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- APP -->
    <div id="vistaApp" class="max-w-5xl mx-auto p-4">
        <header class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div>
                <h1 class="text-2xl font-bold">Licencias</h1>
                <p class="text-sm text-slate-500">Modo: <span id="infoUsuario"></span></p>
            </div>
            <div class="flex gap-2">
                <button onclick="crearNuevaLinea()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded">+ Nueva línea</button>
            </div>
        </header>

        <div class="bg-white rounded-lg shadow overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-slate-50 text-left text-xs uppercase text-slate-500">
                    <tr>
                        <th class="p-2 w-28">Modelo</th>
                        <th class="p-2">MAC placa</th>
                        <th class="p-2">MAC MCI</th>
                        <th class="p-2">Licencia</th>
                        <th class="p-2 w-40 text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCuerpo"></tbody>
            </table>
            <p id="sinDatos" class="hidden p-4 text-center text-slate-400">No hay líneas todavía.</p>
        </div>
    </div>

    <script>
        // ------------------------------------------------------------------
        // 1. SUPABASE (mismas credenciales que instalaciones)
        // ------------------------------------------------------------------
        const SUPABASE_URL = 'https://xgbgnofruzjrvfalckvl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_k1se_GmxiO-45tC5AT_0kA_CtO8lvxf';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Rol según el final del enlace (igual que instalaciones):
        //   index.html?nombre=admin  |  index.html?nombre=editor  |  index.html (user)
        const params = new URLSearchParams(window.location.search);
        const nombreParam = params.get('nombre') || params.get('nobre');
        const rolActual = (nombreParam === 'admin' || nombreParam === 'editor') ? nombreParam : 'user';
        document.body.classList.add('rol-' + rolActual);

        const puedeLicencia = () => rolActual === 'editor' || rolActual === 'admin';
        const puedeEliminar = () => rolActual === 'admin';

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        // ------------------------------------------------------------------
        // 2. OPERACIONES
        // ------------------------------------------------------------------
        async function cargarLicencias() {
            const { data, error } = await db.from('licencias').select('*').order('created_at', { ascending: true });
            if (error) { console.error(error); alert('Error al cargar: ' + error.message); return; }
            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';
            data.forEach(renderizarFila);
            document.getElementById('sinDatos').classList.toggle('hidden', data.length > 0);
        }

        async function crearNuevaLinea() {
            const { data, error } = await db.from('licencias').insert({ modelo: 'Space' }).select().single();
            if (error) { alert('Error al crear la línea: ' + error.message); return; }
            document.getElementById('sinDatos').classList.add('hidden');
            renderizarFila(data);
        }

        async function actualizarCampo(id, campo, valor, input) {
            // Sin validación: se guarda lo escrito (p. ej. solo los 4 últimos dígitos de la MAC);
            // el editor la completa después. El generador exige los 12 dígitos al generar.
            if (campo === 'mac_placa' || campo === 'mac_mci') valor = valor.trim();
            const { error } = await db.from('licencias').update({ [campo]: valor }).eq('id', id);
            if (error) alert('No se pudo guardar: ' + error.message);
        }

        async function eliminarFila(id) {
            if (!confirm('¿Seguro que deseas eliminar esta línea?')) return;
            const { error } = await db.from('licencias').delete().eq('id', id);
            if (error) { alert('No se pudo eliminar: ' + error.message); return; }
            document.getElementById('fila-' + id)?.remove();
            if (!document.getElementById('tablaCuerpo').children.length) document.getElementById('sinDatos').classList.remove('hidden');
        }

        // Abre el generador (solo editor/admin; el propio generador lo vuelve a comprobar)
        function generarTest(id) {
            window.open('generador.html?id=' + encodeURIComponent(id) + '&nombre=' + rolActual, '_blank');
        }

        // ------------------------------------------------------------------
        // 3. RENDER
        // ------------------------------------------------------------------
        function renderizarFila(item) {
            const tr = document.createElement('tr');
            tr.id = 'fila-' + item.id;
            tr.className = 'border-t border-slate-100';
            const idq = esc(item.id);
            tr.innerHTML = `
                <td class="p-2">
                    <select onchange="actualizarCampo('${idq}', 'modelo', this.value, this)" class="w-full p-1 border border-slate-300 rounded">
                        <option value="Space" ${item.modelo === 'Space' ? 'selected' : ''}>Space</option>
                        <option value="Bike" ${item.modelo === 'Bike' ? 'selected' : ''}>Bike</option>
                    </select>
                </td>
                <td class="p-2"><input type="text" maxlength="17" value="${esc(item.mac_placa)}" placeholder="A1B2C3D4E5F6"
                    onchange="actualizarCampo('${idq}', 'mac_placa', this.value, this)" class="mono w-full p-1 border border-slate-300 rounded"></td>
                <td class="p-2"><input type="text" maxlength="17" value="${esc(item.mac_mci)}" placeholder="0A1B2C3D4E5F"
                    onchange="actualizarCampo('${idq}', 'mac_mci', this.value, this)" class="mono w-full p-1 border border-slate-300 rounded"></td>
                <td class="p-2"><input type="text" value="${esc(item.licencia)}" ${puedeLicencia() ? '' : 'disabled title="Solo editor o admin"'}
                    onchange="actualizarCampo('${idq}', 'licencia', this.value, this)" class="w-full p-1 border border-slate-300 rounded disabled:bg-slate-100 disabled:text-slate-400"></td>
                <td class="p-2 text-right whitespace-nowrap">
                    <button onclick="generarTest('${idq}')" class="solo-editor bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded">Generar test</button>
                    <button onclick="eliminarFila('${idq}')" class="solo-admin text-red-500 hover:text-red-700 font-bold p-1 hover:bg-red-50 rounded" title="Eliminar línea">🗑️</button>
                </td>`;
            document.getElementById('tablaCuerpo').appendChild(tr);
        }

        document.getElementById('infoUsuario').textContent = rolActual;
        cargarLicencias();
    </script>
</body>
</html>

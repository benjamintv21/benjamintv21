<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar licencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex items-center justify-center p-4">

    <!-- Solo se ve si el navegador bloquea la segunda pestaña -->
    <div id="aviso" class="hidden bg-white rounded-xl shadow-lg p-6 max-w-sm w-full text-center">
        <h1 class="text-lg font-bold mb-2">🔑 Gestionar licencia</h1>
        <p class="text-sm text-slate-500 mb-4">El navegador ha bloqueado la apertura automática. Pulsa el botón para abrir las dos webs.</p>
        <button id="btnGestionar" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-lg shadow">Gestionar</button>
    </div>

    <script>
        // Enlace "Gestionar" de los avisos de Telegram: abre GesLic en otra pestaña
        // y lleva esta pestaña a la web de licencias en modo editor
        const URL_GESLIC = 'https://imotionems.es/geslic/';
        const URL_LICENCIAS = 'https://benjamintv21.github.io/benjamintv21/licencias/?nombre=editor';

        function abrirAmbas() {
            const pestana = window.open(URL_GESLIC, '_blank');
            if (!pestana) return false;
            window.location.replace(URL_LICENCIAS);
            return true;
        }

        if (!abrirAmbas()) {
            document.getElementById('aviso').classList.remove('hidden');
        }
        document.getElementById('btnGestionar').addEventListener('click', abrirAmbas);
    </script>
</body>
</html>

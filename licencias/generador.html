<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador Control de Calidad</title>
<!-- oculto hasta comprobar sesión y rol (ver script al final) -->
<style>html{visibility:hidden}</style>
<style>
body{margin:0;background:#e5e5e5;font-family:"Segoe UI",Arial,sans-serif;color:#222}
.panel{max-width:620px;margin:20px auto;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:20px 24px}
.panel h1{font-size:18px;margin:0 0 16px}
.row{display:flex;flex-direction:column;margin-bottom:12px}
.row label{font-size:13px;font-weight:600;margin-bottom:4px}
.row input{font-size:15px;padding:7px 9px;border:1px solid #bbb;border-radius:5px}
.row input.mono{font-family:Consolas,monospace;text-transform:uppercase;letter-spacing:1px}
.row input:invalid{border-color:#d33}
.tipo{display:flex;gap:18px;font-size:15px}
.err{color:#d33;font-size:12px;min-height:14px}
.buttons{display:flex;gap:10px;margin-top:8px}
button{font-size:15px;padding:9px 18px;border:0;border-radius:5px;cursor:pointer;background:#2b6cb0;color:#fff}
button.sec{background:#38a169}
button:disabled{background:#aaa;cursor:default}

/* ---------- printable sheet (A4, sizes in pt like the original PDF) ---------- */
.page{position:relative;width:595.32pt;height:841.92pt;margin:20px auto;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);
  overflow:hidden;box-sizing:border-box;padding:35.4pt 0 0 49.2pt;font-family:Calibri,Carlito,"Segoe UI",sans-serif;font-size:10pt;color:#000}
.page table{border-collapse:collapse;width:496.6pt;table-layout:fixed}
/* 0.75pt = 1px exacto: las líneas más finas pueden desaparecer o moverse al imprimir */
.page td,.page th{border:0.75pt solid #000;padding:0 3pt;vertical-align:middle;line-height:1.2}
.page .gap{height:24pt}
.arial{font-family:Arial,Helvetica,sans-serif}
.cab .logo{text-align:center;height:49.3pt}
.cab .logo img{width:103.9pt;height:37.7pt;display:block;margin:0 auto}
.cab .titulo{text-align:center;font:bold 12pt Arial,Helvetica,sans-serif}
.cab .codigo{font:8pt Arial,Helvetica,sans-serif;vertical-align:top;padding-top:6pt}
.cab .codigo div{text-align:center}
.cab .codigo .fecha{text-align:left;margin-top:9pt}
.cab .datos td{vertical-align:top;padding-top:3pt;padding-bottom:3pt;font-weight:bold}
.cab .valor{font-weight:normal;min-height:12pt;margin-bottom:3pt}
.linea{display:inline-block;border-bottom:0.6pt solid #000;width:76pt;font-weight:normal;padding-left:2pt;margin-left:2pt}
.cab td.sel div{display:flex;align-items:center;justify-content:space-between;margin:2pt 8pt 6pt 4pt}
.box{display:inline-block;width:7pt;height:7pt;border:0.8pt solid #000;position:relative;vertical-align:middle}
/* la X es un SVG (los fondos CSS no se imprimen si "Gráficos de fondo" está desactivado) */
.box svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
/* imprimir también los rellenos de color de las cabeceras */
.page,.page *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* la tabla de actividades se monta sobre el borde inferior de la cabecera: evita la línea doble */
.cab + .lista{margin-top:-0.75pt}
.lista th{background:#c6d9f1;font-weight:bold;padding:0 2pt}
.lista tr.h1,.lista tr.h2,.lista tr.slim{background:#c6d9f1}  /* sin rayas blancas entre celdas */
.lista .h1{height:20pt;font-size:11pt}
.lista .h2 th{height:14pt;font-size:8pt;line-height:1}
.lista .slim th{height:13pt;font-size:8pt;line-height:1}
.lista td{height:27pt}
.lista td.id{padding-left:8pt}
.lista td.chk{text-align:center;padding:0}
.lista td.chk .box{width:6.5pt;height:6.5pt}
/* sin líneas verticales entre OK | OK Tall. | NC (solo se mantiene el borde exterior derecho) */
.lista td:nth-child(n+3),.lista .slim th:nth-child(n+3),.lista .h2 th{border-left:0;border-right:0}
.lista td:last-child,.lista .slim th:last-child,.lista .h2 th:last-child{border-right:0.75pt solid #000}
.ok{color:#0070c0}.okt{color:#00b050}.nc{color:#ff0000}
.lista .acc td.txt{font-style:italic}
.obs td{vertical-align:top;padding-top:6pt;font-weight:bold}
.subtit{font-weight:bold;text-decoration:underline;margin:0 0 10pt 8pt}
.pie{position:absolute;left:57pt;right:57pt;bottom:22pt;display:flex;justify-content:space-between;font:10pt Arial,Helvetica,sans-serif}
.pie span:last-child{margin-right:72pt}
@media print{
  html,body{margin:0;padding:0;background:#fff}
  .panel{display:none}
  .page{margin:0;box-shadow:none;width:210mm;height:296.5mm;break-after:page;break-inside:avoid}
  .page:last-child{break-after:auto}
  @page{size:A4;margin:0}
}
</style></head>
<body>
<form class="panel" id="form" autocomplete="off">
  <h1>Control de Calidad Shape Space &mdash; FTL011</h1>
  <div class="row">
    <label>Equipo</label>
    <div class="tipo">
      <label><input type="radio" name="tipo" value="Space" checked> Space</label>
      <label><input type="radio" name="tipo" value="Bike"> Bike</label>
    </div>
  </div>
  <div class="row">
    <label for="tecnico">T&eacute;cnico</label>
    <input id="tecnico" value="Luis Miguel Sandoval">
  </div>
  <div class="row">
    <label for="taller">T&eacute;cnico taller</label>
    <input id="taller">
  </div>
  <div class="row">
    <label for="mac" id="lbl-mac">MAC Space (12 d&iacute;gitos hexadecimales)</label>
    <input id="mac" class="mono" maxlength="17" placeholder="Ej. A1B2C3D4E5F6" required>
    <div class="err" id="err-mac"></div>
  </div>
  <div class="row">
    <label for="ems">MAC EMS (opcional, 12 d&iacute;gitos hexadecimales)</label>
    <input id="ems" class="mono" maxlength="17" placeholder="Ej. 0A1B2C3D4E5F">
    <div class="err" id="err-ems"></div>
  </div>
  <div class="row">
    <label for="fecha">Fecha</label>
    <input id="fecha" type="date">
  </div>
  <div class="buttons">
    <button type="submit">Generar</button>
    <button type="button" class="sec" id="imprimir" disabled>Imprimir</button>
  </div>
</form>

<div id="doc"></div>

      '<tr><td class="logo"><img src="' + LOGO + '" alt="Shape Space"></td>' +
      '<td class="titulo">CONTROL DE CALIDAD SHAPE ' + t.toUpperCase() + '</td>' +
      '<td class="codigo"><div>FTL011</div><div>Rev. 1</div><div class="fecha">Fecha:&nbsp; ' + esc(d.fecha) + '</div></td></tr>' +
      '<tr class="datos">' +
      '<td>Técnico:<div class="valor">' + esc(d.tecnico) + '&nbsp;</div>Técnico taller:<div class="valor">' + esc(d.taller) + '&nbsp;</div></td>' +
      '<td>Cliente:<div class="valor">&nbsp;</div>' +
      '<div style="margin-top:6pt">MAC&nbsp; ' + t.toUpperCase() + ':<span class="linea">' + esc(d.mac) + '&nbsp;</span>' +
      '&nbsp;&nbsp;&nbsp; MAC EMS:<span class="linea">' + esc(d.ems) + '&nbsp;</span></div></td>' +
      '<td class="sel"><div>Space ' + x("Space") + '</div><div>Bike ' + x("Bike") + '</div></td></tr>' +
      '</table>';
  }

  function filas(lista, desde, hasta, acc) {
    var h = "";
    for (var i = desde; i < hasta; i++) {
      var f = lista[i], check = f[1] !== false, sinNumero = f[2], normal = f[3];
      h += '<tr' + (acc ? ' class="acc"' : "") + '><td class="id">' + (sinNumero ? "" : i + 1) + '</td>' +
        '<td class="txt"' + (normal ? ' style="font-style:normal"' : "") + '>' + esc(f[0]).replace(/\n/g, "<br>") + '</td>' +
        (check ? CHECKS : '<td></td><td></td><td></td>') + '</tr>';
    }
    return h;
  }

  function bloque(h, b) {
    var kind = b[0];
    if (kind === "actividades") {
      var head = b[3]
        ? '<tr class="h1"><th rowspan="2">ID</th><th rowspan="2">Actividad</th><th colspan="3" style="font-size:9pt">Conformidad</th></tr><tr class="h2">' + SUB + '</tr>'
        : '<tr class="slim"><th>ID</th><th>Actividad</th>' + SUB + '</tr>';
      return '<table class="lista">' + COLS + head + filas(h.actividades, b[1], b[2], false) + '</table>';
    }
    if (kind === "accesorios") {
      return (b[1] === 0 ? '<div class="gap"></div><p class="subtit">ACCESORIOS:</p>' : '') +
        '<table class="lista">' + COLS + '<tr class="slim"><th>ID</th><th>Accesorio</th>' + SUB + '</tr>' +
        filas(h.accesorios, b[1], b[2], true) + '</table>';
    }
    if (kind === "observaciones-tabla") {
      return '<table class="obs" style="border-top:0">' + '<tr><td style="height:96pt;border-top:0">Observaciones:</td></tr></table>';
    }
    if (kind === "observaciones-caja") {
      return '<table class="obs" style="border-top:0"><tr><td style="height:126pt;border-top:0;font-size:12pt">Observaciones:</td></tr></table>';
    }
    return "";
  }

  function hoja(t, d) {
    var h = HOJAS[t], n = h.paginas.length;
    return h.paginas.map(function (bloques, i) {
      return '<div class="page">' + (i === 0 ? cabecera(d, t) : "") +
        bloques.map(function (b) { return bloque(h, b); }).join("") +
        '<div class="pie"><span>Departamento de Logística</span><span>Página ' + (i + 1) + ' de ' + n + '</span></div></div>';
    }).join("");
  }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var ok = validar("mac", true) & validar("ems", false);
    if (!ok) { $("imprimir").disabled = true; return; }
    $("doc").innerHTML = hoja(tipo(), {
      tecnico: $("tecnico").value.trim(),
      taller: $("taller").value.trim(),
      mac: limpiarMac($("mac").value),
      ems: $("ems").value.trim() ? limpiarMac($("ems").value) : "",
      fecha: fechaTexto()
    });
    $("imprimir").disabled = false;
    $("doc").scrollIntoView({ behavior: "smooth" });
  });

  $("imprimir").addEventListener("click", function () { window.print(); });
})();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Instalaciones</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Ajuste de alto mínimo para las celdas en dispositivos móviles */
        .celda-calendario {
            min-height: 60px;
        }
        @media (min-width: 640px) {
            .celda-calendario {
                min-height: 90px;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-1 sm:p-4 md:p-6">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        
        <!-- CABECERA DE CONTROL DE MES -->
        <div class="p-3 sm:p-4 bg-slate-800 text-white flex flex-col sm:flex-row justify-between items-center gap-2 sm:gap-3">
            <h1 class="text-base sm:text-xl font-bold flex items-center gap-2">
                <span>📅</span> Calendario de Instalaciones
            </h1>
            
            <div class="flex items-center gap-2 bg-slate-700/60 p-1.5 rounded-lg w-full sm:w-auto justify-between sm:justify-start">
                <button onclick="cambiarMes(-1)" class="px-3 py-1 bg-slate-600 hover:bg-slate-500 rounded font-bold transition text-sm">
                    &lt;
                </button>
                <span id="mesAñoLabel" class="font-bold text-xs sm:text-base min-w-[110px] sm:min-w-[130px] text-center tracking-wide">
                    Cargando...
                </span>
                <button onclick="cambiarMes(1)" class="px-3 py-1 bg-slate-600 hover:bg-slate-500 rounded font-bold transition text-sm">
                    &gt;
                </button>
            </div>
        </div>

        <div class="p-1.5 sm:p-6">
            <!-- REJILLA TRADICIONAL DE 7 COLUMNAS (MÓVIL Y ESCRITORIO) -->
            <div>
                <!-- Días de la semana -->
                <div class="grid grid-cols-7 gap-0.5 sm:gap-1 text-center font-bold text-[10px] sm:text-xs uppercase text-slate-500 mb-1 sm:mb-2">
                    <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
                </div>
                <!-- Contenedor de días -->
                <div id="diasCalendarioGrid" class="grid grid-cols-7 gap-0.5 sm:gap-1.5 bg-slate-200 p-0.5 sm:p-1.5 rounded-lg">
                    <!-- Generado dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DETALLE -->
    <div id="modalDetalle" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
        <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-xl shadow-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-start border-b pb-2">
                <div id="modalColorBadge" class="px-2.5 py-1 rounded-md font-bold text-xs uppercase tracking-wide border">
                    Instalación
                </div>
                <button onclick="cerrarModalDetalle()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold leading-none">&times;</button>
            </div>

            <div class="space-y-2 text-center py-2">
                <h3 id="modalCiudad" class="text-xl font-bold text-slate-800"></h3>
                <div id="modalBandera" class="text-3xl leading-none pt-1"></div>
                <p id="modalDireccion" class="text-xs text-slate-500 bg-slate-50 p-2 rounded border mt-2 text-left"></p>
                
                <div id="modalAcciones" class="pt-4">
                    <!-- Botón directo a Google Maps -->
                </div>
            </div>

            <button onclick="cerrarModalDetalle()" class="w-full py-2 bg-slate-100 text-slate-600 rounded-lg font-medium text-xs hover:bg-slate-200 transition">
                Cerrar
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN DE SUPABASE Y COLORES
        // ==========================================
        const SUPABASE_URL = 'https://xgbgnofruzjrvfalckvl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_k1se_GmxiO-45tC5AT_0kA_CtO8lvxf';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const PALETA_ARCOIRIS = [
            { nombre: 'Rojo', hex: '#fecaca' },
            { nombre: 'Naranja', hex: '#ffedd5' },
            { nombre: 'Amarillo', hex: '#fef9c3' },
            { nombre: 'Verde', hex: '#dcfce7' },
            { nombre: 'Añil', hex: '#e0e7ff' },
            { nombre: 'Azul', hex: '#dbeafe' },
            { nombre: 'Violeta', hex: '#f3e8ff' }
        ];

        let registrosCargados = [];
        let fechaCalendarioActual = new Date();

        // ==========================================
        // 2. FUNCIONES AUXILIARES Y BANDERAS
        // ==========================================
        function obtenerColorAsignado(index) {
            return PALETA_ARCOIRIS[index % PALETA_ARCOIRIS.length].hex;
        }

        function extraerCiudad(direccion) {
            if (!direccion) return 'Sin Ciudad';
            const partes = direccion.split(',');
            if (partes.length >= 2) {
                let posibleCiudad = partes[partes.length - 2].trim();
                posibleCiudad = posibleCiudad.replace(/\b\d{4,5}\b/g, '').trim();
                posibleCiudad = posibleCiudad.replace(/\b[A-Z]{2}\b/g, '').trim();
                if (posibleCiudad) return posibleCiudad;
            }
            return partes[0].trim();
        }

        function obtenerEmojiBandera(pais) {
            if (!pais) return '🌐';
            const p = pais.toLowerCase().trim();
            if (p.includes('españa') || p.includes('spain') || p === 'es') return '🇪🇸';
            if (p.includes('italia') || p.includes('italy') || p === 'it') return '🇮🇹';
            if (p.includes('francia') || p.includes('france') || p === 'fr') return '🇫🇷';
            if (p.includes('portugal') || p === 'pt') return '🇵🇹';
            if (p.includes('alemania') || p.includes('germany') || p === 'de') return '🇩🇪';
            if (p.includes('reino unido') || p.includes('uk') || p === 'gb') return '🇬🇧';
            if (p.includes('marruecos') || p.includes('morocco') || p === 'ma') return '🇲🇦';
            return '🌐';
        }

        // ==========================================
        // 3. CARGA DE DATOS DESDE SUPABASE
        // ==========================================
        async function cargarInstalaciones() {
            const { data, error } = await db
                .from('instalaciones')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error("Error al cargar instalaciones:", error);
                return;
            }

            registrosCargados = data.map((item, index) => {
                item.color = obtenerColorAsignado(index);
                return item;
            });

            renderizarCalendario();
        }

        // ==========================================
        // 4. LÓGICA Y RENDERIZADO DEL CALENDARIO
        // ==========================================
        function cambiarMes(delta) {
            fechaCalendarioActual.setMonth(fechaCalendarioActual.getMonth() + delta);
            renderizarCalendario();
        }

        function renderizarCalendario() {
            const gridCalendario = document.getElementById('diasCalendarioGrid');
            gridCalendario.innerHTML = '';

            const año = fechaCalendarioActual.getFullYear();
            const mes = fechaCalendarioActual.getMonth();

            const nombresMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('mesAñoLabel').innerText = `${nombresMeses[mes]} ${año}`;

            const primerDia = new Date(año, mes, 1);
            const ultimoDia = new Date(año, mes + 1, 0);

            let diaSemanaInicio = primerDia.getDay() - 1;
            if (diaSemanaInicio === -1) diaSemanaInicio = 6;

            // Días vacíos de inicio de mes
            for (let i = 0; i < diaSemanaInicio; i++) {
                const divVacio = document.createElement('div');
                divVacio.className = 'bg-white/40 celda-calendario rounded-md sm:rounded-lg';
                gridCalendario.appendChild(divVacio);
            }

            // Días del mes
            for (let d = 1; d <= ultimoDia.getDate(); d++) {
                const fechaKey = `${año}-${String(mes + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const instalacionesDelDia = registrosCargados.filter(item => item.fecha_instalacion === fechaKey);

                const celda = document.createElement('div');
                celda.className = 'bg-white celda-calendario rounded-md sm:rounded-lg p-0.5 sm:p-1.5 flex flex-col justify-between border border-slate-100 shadow-xs overflow-hidden';

                const numDia = document.createElement('div');
                numDia.className = 'font-bold text-slate-700 text-right text-[10px] sm:text-xs pr-0.5 sm:pr-1';
                numDia.innerText = d;
                celda.appendChild(numDia);

                const listaContenedor = document.createElement('div');
                listaContenedor.className = 'flex-1 flex flex-col gap-0.5 sm:gap-1 justify-center overflow-hidden';

                instalacionesDelDia.forEach((item) => {
                    const bloque = document.createElement('button');
                    bloque.className = 'w-full text-left font-bold text-[8px] sm:text-[10px] px-0.5 sm:px-1.5 py-0.5 leading-tight truncate rounded border border-slate-300 shadow-xs hover:brightness-95 transition';
                    bloque.style.backgroundColor = item.color;
                    bloque.innerText = `📍 ${extraerCiudad(item.direccion)}`;
                    bloque.onclick = () => abrirModalDetalle(item);
                    listaContenedor.appendChild(bloque);
                });

                celda.appendChild(listaContenedor);
                gridCalendario.appendChild(celda);
            }
        }

        // ==========================================
        // 5. MODAL DE DETALLES Y REDIRECCIÓN MAPS
        // ==========================================
        function abrirModalDetalle(item) {
            const badge = document.getElementById('modalColorBadge');
            badge.style.backgroundColor = item.color;
            badge.innerText = item.pais || 'Instalación';

            document.getElementById('modalCiudad').innerText = `📍 ${extraerCiudad(item.direccion)}`;
            document.getElementById('modalBandera').innerText = obtenerEmojiBandera(item.pais);
            document.getElementById('modalDireccion').innerText = item.direccion || 'Sin dirección registrada';

            const acciones = document.getElementById('modalAcciones');
            acciones.innerHTML = '';

            if (item.direccion) {
                const mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.direccion)}`;
                acciones.innerHTML = `
                    <a href="${mapLink}" target="_blank" class="w-full block text-center py-3 bg-indigo-600 text-white rounded-xl font-bold text-sm shadow-md hover:bg-indigo-700 active:scale-95 transition-all">
                        🗺️️ Abrir en Google Maps
                    </a>
                `;
            } else {
                acciones.innerHTML = `<span class="text-xs text-red-500">Sin dirección para Google Maps</span>`;
            }

            document.getElementById('modalDetalle').classList.remove('hidden');
        }

        function cerrarModalDetalle() {
            document.getElementById('modalDetalle').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', cargarInstalaciones);
    </script>
</body>
</html>
